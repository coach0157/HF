name: village-security-app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Bootstrap superuser — used ONLY by docker's own initdb process and
      # for ad-hoc admin access (e.g. `docker compose exec db psql`). The
      # app itself connects as `village_app`, a non-superuser role created
      # by infra/postgres/init/01-init.sql specifically so that PostgreSQL
      # Row-Level Security policies actually apply to it — see
      # docs/ARCHITECTURE.md and apps/backend/prisma/sql/rls-policies.sql.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_bootstrap_password
    ports:
      - '5432:5432'
    volumes:
      - village_db_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U village_app -d village_security']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  village_db_data:
